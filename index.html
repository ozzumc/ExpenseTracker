<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
    <main class="mx-auto max-w-3xl space-y-6 p-6">
      <header>
        <p class="text-sm font-medium text-emerald-600">Expense Tracker</p>
        <h1 class="text-3xl font-semibold">Harcamalarım</h1>
      </header>

      <div class="grid gap-6 md:grid-cols-2">
        <form
          id="expense-form"
          class="space-y-3 rounded-2xl border border-slate-200 bg-white p-5"
        >
          <h2 class="font-semibold">Yeni harcama</h2>
          <input
            id="description"
            type="text"
            placeholder="Description"
            class="w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
          />
          <input
            id="amount"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="Amount"
            class="w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
          />
          <select
            id="category"
            class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
          >
            <option value="Food">Food/Drink</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          <button
            type="submit"
            class="w-full cursor-pointer rounded-lg bg-emerald-600 px-4 py-2 font-medium text-white transition hover:bg-emerald-700"
          >
            Add expense
          </button>
        </form>

        <div class="space-y-6">
          <section class="rounded-2xl bg-emerald-600 p-5 text-white">
            <h2 class="text-sm font-medium text-emerald-100">Total</h2>
            <p id="grand-total" class="text-4xl font-semibold tracking-tight">
              0.00
            </p>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white p-5">
            <h2 class="mb-3 font-semibold">By category</h2>
            <ul id="category-totals" class="space-y-2 text-sm"></ul>
          </section>
        </div>
      </div>

      <section class="rounded-2xl border border-slate-200 bg-white p-5">
        <h2 class="mb-3 font-semibold">Expenses</h2>
        <ul id="expense-list" class="divide-y divide-slate-100"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
